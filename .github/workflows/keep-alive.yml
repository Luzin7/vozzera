name: Render Keep-Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://vozzera.onrender.com/api/health
    steps:
      - name: Ping Render API
        run: |
          set -euo pipefail
          echo "Enviando ping para manter o Render acordado..."
          status=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null -w "%{http_code}" "$HEALTH_URL")
          echo "Status recebido: $status"
          if [ "$status" -ne 200 ]; then
            echo "Servidor respondeu com status inesperado ($status)."
            exit 1
          fi
          echo "Servidor está acordado!"
