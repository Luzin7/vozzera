name: Deploy

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  migrate:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Goose
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh -s v3.27.3
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run Migrations on Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Aplicando migrações com Goose no Neon..."
          goose -dir sql/migrations postgres "$DATABASE_URL" up
          echo "Migrações aplicadas com sucesso!"

  build-and-push:
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-render:
    needs: [migrate, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "RENDER_DEPLOY_HOOK_URL ausente"; exit 1; }
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) ;; *) echo "RENDER_DEPLOY_HOOK_URL sem query string"; exit 1 ;; esac
          curl -fsS -X POST --max-time 30 "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
