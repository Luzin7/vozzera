name: 💡 Sugestão
description: Ideia de funcionalidade ou melhoria
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual o problema ou lacuna?
      description: O que você sente falta ou não consegue fazer hoje?
    validations:
      required: true
  - type: textarea
    id: solucao
    attributes:
      label: O que você gostaria que existisse?
      description: Descreva a ideia do seu jeito. Não precisa saber termos técnicos.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Algum exemplo ou referência?
      description: Print de outro app, link, desenho à mão — vale tudo.
    validations:
      required: false