name: 🐛 Reportar bug
description: Algo não está funcionando como deveria
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema de forma simples e direta.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como chegar nesse erro?
      description: O que você fez pra chegar aqui? Quanto mais detalhes, melhor.
      placeholder: |
        1. Subi o servidor com `make run`
        2. Chamei a rota X
        3. Recebi tal erro
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria ter acontecido?
      description: Qual era a sua expectativa?
    validations:
      required: true
  - type: textarea
    id: captura
    attributes:
      label: Logs ou prints (se tiver)
      description: Cole a saída do terminal ou arraste uma imagem. Ajuda muito.
    validations:
      required: false