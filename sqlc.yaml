version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/auth/queries.sql"
    schema: "sql/migrations/"
    gen:
      go:
        package: "auth"
        out: "internal/auth"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time

  - engine: "postgresql"
    queries: "internal/chat/queries.sql"
    schema: "sql/migrations/"
    gen:
      go:
        package: "chat"
        out: "internal/chat"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - engine: "postgresql"
    queries: "internal/voice/queries.sql"
    schema: "sql/migrations/"
    gen:
      go:
        package: "voice"
        out: "internal/voice"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time