openapi: 3.0.3
info:
  title: Vozzera API
  description: |
    API do Vozzera — salas de texto e voz, mensagens e autenticação.
    WebSocket em `/api/ws` com protocolo versionado (envelope `v:1`).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Cadastro, login e logout
  - name: rooms
    description: Salas de texto
  - name: messages
    description: Mensagens das salas
  - name: voice
    description: Salas de voz (LiveKit)
  - name: websocket
    description: Conexão WebSocket para eventos em tempo real
paths:
  /api/register:
    post:
      tags: [auth]
      summary: Criar conta
      operationId: register
      description: Exige o código de convite. Sucesso retorna 201.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email, invite_code]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                email:
                  type: string
                  format: email
                invite_code:
                  type: string
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: string, format: uuid }
        "400":
          description: Payload inválido ou validação falhou
        "403":
          description: Código de convite inválido
        "409":
          description: Username já em uso
  /api/login:
    post:
      tags: [auth]
      summary: Entrar
      operationId: login
      description: Aceita username ou email como identificador. Define o cookie HttpOnly `auth_token` com o id opaco da sessão. As rotas protegidas usam esse cookie. A sessão expira após `SESSION_TTL` sem atividade (expiração deslizante) e pode ser revogada em `/api/logout`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Usuário ou email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 72
      responses:
        "200":
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: string, format: uuid }
                  username: { type: string }
        "400":
          description: Payload inválido
        "401":
          description: Credenciais inválidas
  /api/logout:
    post:
      tags: [auth]
      summary: Sair
      operationId: logout
      description: Revoga a sessão atual, apaga o cookie `auth_token` e derruba as conexões WebSocket da sessão. Requer autenticação.
      responses:
        "204":
          description: Sessão revogada
        "401":
          description: Não autenticado
  /api/me:
    get:
      tags: [auth]
      summary: Usuário autenticado
      operationId: me
      description: Devolve os dados atuais do usuário da sessão, consultando o banco. Requer autenticação.
      responses:
        "200":
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  role: { type: string, enum: [user, mod, admin] }
                  email: { type: string, format: email }
        "401":
          description: Não autenticado ou sessão inválida
    patch:
      tags: [auth]
      summary: Atualizar email do usuário autenticado
      operationId: updateEmail
      description: Troca o email da conta. Não pode colidir com o email de outra conta. Requer autenticação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Email atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  email: { type: string, format: email }
        "400":
          description: Email inválido
        "401":
          description: Não autenticado ou sessão inválida
        "409":
          description: Email já está em uso por outra conta
  /api/forgot-password:
    post:
      tags: [auth]
      summary: Solicitar redefinição de senha
      operationId: requestPasswordReset
      description: Envia um email com link de redefinição se o email estiver cadastrado. A resposta é a mesma para email inexistente, para não vazar quais contas existem.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Pedido aceito (email enviado se cadastrado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Email inválido
  /api/reset-password:
    post:
      tags: [auth]
      summary: Redefinir senha
      operationId: resetPassword
      description: Troca a senha usando o token recebido por email. O token é de uso único e expira após `PASSWORD_RESET_TTL`. Revoga todas as sessões do usuário.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: Senha redefinida
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Token inválido/expirado ou senha inválida
  /api/rooms:
    get:
      tags: [rooms]
      summary: Listar salas
      operationId: listRooms
      responses:
        "200":
          description: Lista de salas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          description: Não autenticado
    post:
      tags: [rooms]
      summary: Criar sala
      operationId: createRoom
      description: Apenas moderadores e administradores criam salas. Dispara `room.created` no tópico `app:rooms`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                type:
                  type: string
                  enum: [text, voice]
      responses:
        "201":
          description: Sala criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Validação falhou
        "401":
          description: Não autenticado
        "403":
          description: Apenas moderadores e administradores
  /api/rooms/{id}:
    patch:
      tags: [rooms]
      summary: Editar sala
      operationId: updateRoom
      description: Apenas moderadores e administradores editam salas. Dispara `room.updated` no tópico `room:<id>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: Sala atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Validação falhou
        "401":
          description: Não autenticado
        "403":
          description: Apenas moderadores e administradores
        "404":
          description: Sala não encontrada
    delete:
      tags: [rooms]
      summary: Deletar sala
      operationId: deleteRoom
      description: Hard delete — apaga a sala e, via cascade, suas mensagens. Apenas moderadores e administradores. Dispara `room.deleted` no tópico `room:<id>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Sala deletada
        "400":
          description: ID de sala inválido
        "401":
          description: Não autenticado
        "403":
          description: Apenas moderadores e administradores
        "404":
          description: Sala não encontrada
  /api/rooms/{id}/messages:
    get:
      tags: [messages]
      summary: Listar mensagens da sala
      operationId: getRoomMessages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Quantidade de mensagens (mais recentes primeiro)
      responses:
        "200":
          description: Mensagens da sala
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          description: ID de sala inválido
        "401":
          description: Não autenticado
  /api/rooms/{id}/messages/{content_id}:
    patch:
      tags: [messages]
      summary: Editar mensagem
      operationId: updateMessage
      description: Só o autor edita. Mensagem deletada não pode ser editada. Dispara `message.updated` no tópico `room:<id>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: content_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "200":
          description: Mensagem atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUpdated"
        "400":
          description: Validação falhou
        "401":
          description: Não autenticado
        "403":
          description: Não é o autor, ou mensagem não encontrada/deletada
    delete:
      tags: [messages]
      summary: Deletar mensagem
      operationId: deleteMessage
      description: Soft delete — marca `deleted_at` e zera o `content`. O autor deleta a própria; moderadores e administradores deletam qualquer uma. Dispara `message.deleted` no tópico `room:<id>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: content_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mensagem deletada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  room_id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  content: { type: string, nullable: true }
                  created_at: { type: string, format: date-time }
        "401":
          description: Não autenticado
        "403":
          description: Não é o autor, ou mensagem não encontrada/deletada
  /api/ws:
    get:
      tags: [websocket]
      summary: Conexão WebSocket para eventos em tempo real
      operationId: wsConnect
      description: |
        Conexão autenticada pelo cookie `auth_token`. O servidor valida a origem contra CORS_ORIGINS.

        ## Formato do envelope

        Todas as mensagens usam o envelope versionado:

        ```json
        {"v":1,"type":"<evento>","topic":"<tópico>","ts":"<ISO 8601>","data":{...}}
        ```

        ## Comandos enviados pelo cliente

        | type | data | Descrição |
        |------|------|-----------|
        | `room.subscribe` | `{"room_id":"<uuid>"}` | Assinar tópico de uma sala (`room:<uuid>`). A sala precisa existir e ser do tipo `text`. |
        | `room.unsubscribe` | `{"room_id":"<uuid>"}` | Sair do tópico da sala |
        | `typing.start` | `{"room_id":"<uuid>"}` | Indicar que está digitando |
        | `typing.stop` | `{"room_id":"<uuid>"}` | Indicar que parou de digitar |
        | `message` | `{"room_id":"<uuid>","content":"texto"}` | Enviar mensagem (1–4000 caracteres). Salva no banco e dispara `message.created` |

        ## Eventos recebidos pelo cliente

        ### message.created
        Tópico `room:<uuid>` — nova mensagem na sala:
        ```json
        {
          "v":1,
          "type":"message.created",
          "topic":"room:<uuid>",
          "ts":"2026-08-26T12:00:00Z",
          "data":{
            "id":"<uuid>",
            "room_id":"<uuid>",
            "user_id":"<uuid>",
            "username":"joao",
            "content":"texto",
            "created_at":"2026-08-26T12:00:00Z"
          }
        }
        ```

        ### message.updated
        Tópico `room:<uuid>` — mensagem editada:
        ```json
        {
          "v":1,
          "type":"message.updated",
          "topic":"room:<uuid>",
          "data":{
            "content_id":"<uuid>",
            "room_id":"<uuid>",
            "user_id":"<uuid>",
            "content":"editado"
          }
        }
        ```

        ### message.deleted
        Tópico `room:<uuid>` — mensagem deletada:
        ```json
        {
          "v":1,
          "type":"message.deleted",
          "topic":"room:<uuid>",
          "data":{
            "content_id":"<uuid>",
            "room_id":"<uuid>",
            "user_id":"<uuid>",
            "is_mod":false
          }
        }
        ```

        ### room.created
        Tópico `app:rooms` — sala criada:
        ```json
        {
          "v":1,
          "type":"room.created",
          "topic":"app:rooms",
          "data":{
            "id":"<uuid>",
            "name":"sala",
            "type":"text",
            "created_at":"2026-08-26T12:00:00Z"
          }
        }
        ```

        ### room.updated
        Tópico `room:<uuid>` — sala editada:
        ```json
        {
          "v":1,
          "type":"room.updated",
          "topic":"room:<uuid>",
          "data":{
            "id":"<uuid>",
            "name":"novo-nome",
            "type":"text",
            "created_at":"2026-08-26T12:00:00Z"
          }
        }
        ```

        ### room.deleted
        Tópico `room:<uuid>` — sala deletada:
        ```json
        {
          "v":1,
          "type":"room.deleted",
          "topic":"room:<uuid>",
          "data":{"id":"<uuid>","is_mod":false}
        }
        ```

        ### typing.start / typing.stop
        Tópico `room:<uuid>` — reporte de digitação:
        ```json
        {
          "v":1,
          "type":"typing.start",
          "topic":"room:<uuid>",
          "data":{"user_id":"<uuid>","username":"joao"}
        }
        ```

        ### system.error
        Tópico genérico — erro do servidor (ex: conteúdo inválido)
      responses:
        "101":
          description: Upgraded para WebSocket
        "401":
          description: Não autenticado
  /api/voice/token:
    post:
      tags: [voice]
      summary: Gerar token do LiveKit para entrar em sala de voz
      operationId: getVoiceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string, format: uuid }
      responses:
        "200":
          description: Token e URL do LiveKit
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }
                  room_name: { type: string }
        "400":
          description: Sala não é de voz ou payload inválido
        "401":
          description: Não autenticado
        "404":
          description: Sala não encontrada
  /api/voice/rooms:
    get:
      tags: [voice]
      summary: Listar salas de voz
      operationId: listVoiceRooms
      description: Filtra apenas salas com type=voice.
      responses:
        "200":
          description: Lista de salas de voz
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          description: Não autenticado
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Cookie HttpOnly com o id opaco da sessão, definido em POST /api/login. Sessão revogável via POST /api/logout.
  schemas:
    Room:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [text, voice] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        created_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        username: { type: string }
    MessageUpdated:
      type: object
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        content: { type: string }
        updated_at: { type: string, format: date-time }